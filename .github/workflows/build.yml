name: Las Vegas Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Extract and brand project
        run: python3 -m zipfile -e vegas-projeto-completo-trabalho.zip . && chmod +x gradlew && python3 -c "from pathlib import Path; p=Path('app/src/main/res/values/strings.xml'); s=p.read_text(); s=s.replace('<string name=\"app_name\">Vegas</string>','<string name=\"app_name\">Las Vegas</string>').replace('Servidores VEGAS','Servidores LAS VEGAS').replace('Vegas VPN</string>','Las Vegas VPN</string>').replace('Status Vegas</string>','Status Las Vegas</string>').replace('Configurar widget Vegas</string>','Configurar widget Las Vegas</string>'); p.write_text(s); p=Path('app/src/main/res/layout/activity_main.xml'); s=p.read_text().replace('android:text=\"VEGAS\"','android:text=\"LAS VEGAS\"').replace('Vegas • alimentação VPN Gate','Las Vegas • catálogo VPN Gate').replace('Widget Vegas','Widget Las Vegas').replace('Os servidores são operados por voluntários Vegas -  VPN Gate','Os servidores são operados por voluntários do VPN Gate'); p.write_text(s); p=Path('app/src/main/res/layout/tela_introducao.xml'); p.write_text(p.read_text().replace('android:text=\"VEGAS\"','android:text=\"LAS VEGAS\"')); p=Path('app/src/main/java/br/com/vegas/independente/MainActivity.kt'); p.write_text(p.read_text().replace('removeCall1backs','removeCallbacks').replace('Bem vindo ao Vegas VPN','Bem-vindo ao Las Vegas VPN')); p=Path('app/src/main/java/br/com/vegas/independente/ServerCardText.kt'); p.write_text(p.read_text().replace('servidor Vegas - VPN GATE  indisponível','servidor Las Vegas — VPN Gate indisponível')); p=Path('settings.gradle.kts'); p.write_text(p.read_text().replace('VegasIndependente','LasVegas'))"
      - name: Add project README and public license
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          Path('README.md').write_text('# Las Vegas\n\nLas Vegas é um aplicativo Android com catálogo comunitário de servidores VPN Gate, consulta sob demanda, triagem de perfis e controle direto do usuário.\n\n## Destaques\n\n- Consulta manual ao catálogo VPN Gate por HTTPS, após confirmação.\n- Servidores organizados por país, endereço, operador declarado, ping e velocidade.\n- Triagem dos perfis recebidos antes da seleção.\n- Fluxo experimental OpenVPN em build de desenvolvimento, com consentimento do Android.\n- Tela inicial, widget e compilação automatizada pelo GitHub Actions.\n\nServidores Gate são os servidores comunitários listados pelo VPN Gate.\n\n## Compilar\n\nRequisitos: JDK 17, Android SDK API 35 e build-tools 34.0.0.\n\n```sh\n./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon\n```\n\n## Licença\n\nGNU General Public License v2.0 only. Consulte LICENSE e openvpn-engine/LICENSE.\n', encoding='utf-8')
          shutil.copyfile('openvpn-engine/LICENSE', 'LICENSE')
          Path('gradlew').chmod(0o755)
          for path in (Path('app/src/main')).rglob('*.xml'):
              import xml.etree.ElementTree as ET
              ET.parse(path)
          PYCODE
          rm -f .github/workflows/android-debug.yml vegas-projeto-completo-trabalho.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Las Vegas open-source source and documentation' || true
          git push origin HEAD:main
      - uses: gradle/actions/setup-gradle@v4
      - name: Run source checks
        run: python3 tests/verify_experimental_gate.py && python3 tests/verify_isolation.py && python3 tests/run_java_tests.py
      - name: Build and test Android app
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: las-vegas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
