name: VegasVPN Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install required SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Extract source package
        run: |
          mkdir -p vegas-src
          python3 -m zipfile -e vegas-projeto-completo-trabalho.zip vegas-src
          chmod +x vegas-src/gradlew
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('vegas-src/app/src/main/java/br/com/vegas/independente/MainActivity.kt')
          p.write_text(p.read_text().replace('removeCall1backs', 'removeCallbacks'))
          p = Path('vegas-src/app/src/main/java/br/com/vegas/independente/ServerCardText.kt')
          p.write_text(p.read_text().replace('Iniciar localmente — servidor Vegas - VPN GATE  indisponível', 'Teste local — servidor VPN Gate indisponível'))
          PYCODE
      - name: Verify experimental gating and isolation
        working-directory: vegas-src
        run: |
          python3 tests/verify_experimental_gate.py
          python3 tests/verify_isolation.py
          python3 tests/run_java_tests.py
      - name: Build and test Android debug APK
        working-directory: vegas-src
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vegasvpn-debug-apk
          path: vegas-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
