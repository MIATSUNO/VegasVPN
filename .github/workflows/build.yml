name: Las Vegas Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Extract source, apply Las Vegas identity and open-source docs
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -f vegas-projeto-completo-trabalho.zip ]; then
            python3 .github/scripts/open_source_project.py
            rm -f vegas-projeto-completo-trabalho.zip
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Publish Las Vegas open-source source and documentation' || true
            git push origin HEAD:main
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source files and XML
        run: python3 tests/verify_project.py
      - name: Verify experimental VPN Gate policy
        run: python3 tests/verify_experimental_gate.py
      - name: Verify experimental isolation
        run: python3 tests/verify_isolation.py
      - name: Run offline Java tests
        run: python3 tests/run_java_tests.py
      - name: Build and test Android app
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: las-vegas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
